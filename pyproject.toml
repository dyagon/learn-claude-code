[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-claude-code"
version = "0.1.0"
description = "A simple project for learning Claude Code"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["utils*", "hello*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
